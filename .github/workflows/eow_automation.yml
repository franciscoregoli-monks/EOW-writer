name: EOW automation

on:
  schedule:
    # GitHub cron is UTC. These map to ART (UTC-3).
    - cron: "0 23 * * 4" # Thursday 20:00 America/Argentina/Buenos_Aires
    - cron: "0 11 * * 5" # Friday 08:00 America/Argentina/Buenos_Aires
  repository_dispatch:
    types: [trigger_eow_generation]
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline phase
        required: true
        default: generate
        type: choice
        options:
          - generate
          - send-email

permissions:
  contents: write

concurrency:
  group: eow-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select pipeline phase
        id: phase
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" == "0 11 * * 5" ]]; then
            echo "mode=send-email" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=$MANUAL_MODE" >> "$GITHUB_OUTPUT"
          else
            echo "mode=generate" >> "$GITHUB_OUTPUT"
          fi

      - name: Run EOW phase
        id: eow
        run: python main.py --mode "${{ steps.phase.outputs.mode }}"

      - name: Commit generated state
        if: ${{ always() && (steps.eow.outcome == 'success' || steps.phase.outputs.mode == 'send-email') }}
        shell: bash
        run: |
          if git diff --quiet -- history; then
            echo "No history state changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          git commit -m "Update EOW automation state"
          git push
